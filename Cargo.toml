[workspace]
resolver = "3"
members = ["crates/galata-tower"]

# Declared once, and taken once — every member says `license.workspace = true`,
# the convention galata-datawatch and galata-vault already hold.
[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sercanatalik/galata-tower"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
# **The record, read-only.** The tower watches the RECORD, not the worker: a
# heartbeat is a claim, a closed partition still holding 1,412 segments is a
# fact on disk. `partitions`, `frontier` and `overdue_closed` are that fact.
#
# PATH dependencies, and they have to be: galata-datawatch is pre-0.1.0 and
# publishes nothing yet (`cargo search galata-segments` returns nothing). They
# become registry dependencies when its Tier 10 lands, and the sibling checkout
# stops being load-bearing.
galata-segments = { path = "../galata-datawatch/crates/galata-segments" }
galata-wire = { path = "../galata-datawatch/crates/galata-wire" }
# The bus. One subscription over `status.>`, fanned to every browser -- which is
# the case `NatsSubscriber::next_addressed` documents itself for. Measured: it
# takes this tree from 168 crates to 243, and brings rustls, which is TLS rather
# than venue transport and is why `check-no-capture-loop.sh` stopped forbidding
# it (2026-09-22).
galata-broker = { path = "../galata-datawatch/crates/galata-broker" }
# **`default-features = false`, and this is the whole dependency argument.**
# The tape schemas, and none of the capture loop: a tree built without
# `capture` links ZERO transport crates — 541 down to 279, measured in
# galata-datawatch's `design/measured.md`. The tower must never acquire the
# websocket stack to read parquet, and `scripts/check-no-capture-loop.sh`
# asks cargo rather than trusting this comment.
galata-datawatch = { path = "../galata-datawatch/crates/galata-datawatch", default-features = false }

axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One binary serves the API and the screen. The cereyan pattern, already proven
# in this user's tree.
rust-embed = { version = "8.12", features = ["interpolate-folder-path"] }
# The contract, derived rather than written. The predecessor kept 669 lines of
# hand-typed TypeScript and a 343-line fixture test whose own header admits the
# weakness: "a field the server REMOVES fails naming it, and a field it ADDS
# passes. One direction." Deriving the schemas from the response types and the
# paths from the routes means a route is declared once.
utoipa = { version = "5.5", features = ["axum_extras"] }
# `OpenApiRouter` takes the paths from the axum routes themselves. Without it a
# route is written for axum and described again for the document, and the two
# drift exactly the way the hand-written types did.
utoipa-axum = "0.2"
# A broadcast receiver as a Stream, for the SSE body.
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
